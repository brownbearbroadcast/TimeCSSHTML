<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Timecode Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="center">
    <h1>Timecode Calculator</h1>
  </div>
  <div class="center">
    
    <input class="input" id="start" minlength="11" maxlength="11" inputmode=“numeric”  pattern="[0-9]" value="00:00:00:00" />
  </div
  <p></p>
  <div class="center">
    <!--<h2>End Timecode</h2>-->
    <input class="input" id="end" minlength="11" maxlength="11" inputmode=“numeric”  pattern="[0-9]" value="00:00:00:00" />
    <p></p>
  </div>
  <div class="center">
    <p>Format: HH:MM:SS:FF</p>
  </div>
  <div class="center">
    <button onclick="foo()" type="button">Submit</button>
  </div>
  <div class="center">
    <h2>Result</h2>
  </div>
  <div class="center">
    <p id="result"></p>
  </div>
  <script src="javascript/DropFrame.js"></script>
  <script src="index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
  <script src="javascript/startInput.js"></script>
  <script src="javascript/endInput.js" ></script>

  <script>function foo(){
    let end = document.getElementById("end").value;
    let start = document.getElementById("start").value;
    let startHour = Number(start.slice(0,2));
    let startMinute = Number(start.slice(3,5));
    let startSecond = Number(start.slice(6,8));
    let startFrame = Number(start.slice(9,11));
    console.log(startHour, startMinute, startSecond, startFrame);
    let endHour = Number(end.slice(0,2));
    let endMinute = Number(end.slice(3,5));
    let endSecond = Number(end.slice(6,8));
    let endFrame = Number(end.slice(9,11));
    console.log(endHour, endMinute, endSecond, endFrame);
    let startTimecode = new DropFrame(startFrame, startSecond, startMinute, startHour);
    startTimecode.display();
    let endTimecode = new DropFrame(endFrame, endSecond, endMinute, endHour);
    endTimecode.display();
    let duration = startTimecode.duration(startTimecode, endTimecode);
    document.getElementById("result").innerHTML = duration.string(new Intl.NumberFormat('en-US', {  minimumIntegerDigits: 2 }));
}</script>
</body>

</html>
