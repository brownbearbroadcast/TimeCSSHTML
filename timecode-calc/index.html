<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Timecode Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="center">
    <h1>Timecode Calculator</h1>
  </div>
  <div class="center">
    
    <input class="input" id="start" minlength="11" maxlength="11" inputmode=“numeric”  pattern="[0-9]*" value="00:00:00:00" />
  </div>
  <p></p>
  <div class="center">
    <!--<h2>End Timecode</h2>-->
    <input class="input" id="end" minlength="11" maxlength="11" inputmode=“numeric”  pattern="[0-9]*" value="00:00:00:00" />
    <p></p>
  </div>
  <div class="center">
    <p>Format: HH:MM:SS:FF</p>
  </div>
  <div class="center">
<select name="operation" id="operation">
  <option value="Duration" selected>Duration</option>
  <option value="Add">Add</option>
  <option value="Subtract">Subtract</option>
</select>

<button onclick="flagSubmit()" type="button">Submit</button>
  </div>
  <div class="center">
    <h2>Result</h2>
  </div>
  <div class="center">
    <p id="result"></p>
  </div>
  <script src="javascript/DropFrame.js"></script>
  <script src="index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
  <script src="javascript/startInput.js"></script>
  <script src="javascript/endInput.js" ></script>

  <script>function flagSubmit(){
    const flag = document.getElementById("operation").value;
    let end = document.getElementById("end").value;
    let start = document.getElementById("start").value;
    let topTimecode = new DropFrame(Number(start.slice(9,11)), Number(start.slice(6,8)), Number(start.slice(3,5)), Number(start.slice(0,2)));
    topTimecode.display();
    let bottomTimecode = new DropFrame(Number(end.slice(9,11)), Number(end.slice(6,8)), Number(end.slice(3,5)), Number(end.slice(0,2)));
    bottomTimecode.display();
    console.log(flag);
  
    if (flag == "Duration"){
        if (topTimecode.frame_count > bottomTimecode.frame_count) {
        alert("Start timecode must be less than or equal to end timecode.");
        return;
    }
    console.log("hello there");
    var resultant = topTimecode.duration(topTimecode, bottomTimecode);
    }
    if (flag == "Add"){
    var resultant = topTimecode.add(bottomTimecode);
    }
    if (flag == "Subtract"){
      if (topTimecode.frame_count < bottomTimecode.frame_count) {
        alert("Minuend (bottom) timecode must be less than or equal to original timecode.");
        return;
      }
      topTimecode.subtract(bottomTimecode);
      var resultant = topTimecode;;
    }
    console.log(resultant);
    document.getElementById("result").innerHTML = resultant.string(new Intl.NumberFormat('en-US', {  minimumIntegerDigits: 2 }));
}</script>
</body>

</html>
